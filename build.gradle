plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
version = project.mod_version
group = 'com.koutakutenn.overpoweredagain'
base { archivesName = 'overpowered-again' }
repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.terraformersmc.com/releases/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The loader has to be on the runtime classpath as well, otherwise KnotServer is missing when
    // the development server starts; it is not packaged into the built jar.
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    compileOnly "com.terraformersmc:modmenu:20.0.2"
    // Loader alone does not mount assets/data. Bundle the resource loader and its base module.
    implementation include("net.fabricmc.fabric-api:fabric-resource-loader-v1:2.0.13+9edec1269e")
    implementation include("net.fabricmc.fabric-api:fabric-api-base:2.0.4+ece063239e")
    compileOnly "net.fabricmc:sponge-mixin:0.17.4+mixin.0.8.7"
    // Deliberately no Mixin annotation processor: sponge-mixin 0.17.4 ships only MCP and FG3
    // obfuscation services, so the processor cannot resolve intermediary names for 26.2 and fails
    // the build with "Unable to locate obfuscation mapping". 26.2 maps with intermediary 0.0.0,
    // which is an identity mapping, so no refmap is needed and Mixin resolves targets directly.
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand(version: project.version) }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
jar { from('LICENSE') }

// Separate test mod: never included in the distributable jar.
sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.output + sourceSets.main.runtimeClasspath
    }
}
configurations {
    integrationTestImplementation.extendsFrom implementation
    integrationTestRuntimeOnly.extendsFrom runtimeOnly
}
def integrationTestDirectory = "run-test/run-${System.currentTimeMillis()}"
loom {
    mods {
        overpowered_again { sourceSet sourceSets.main }
        overpowered_again_test { sourceSet sourceSets.integrationTest }
    }
    runs {
        integrationTest {
            server()
            name 'Overpowered Again Integration Tests'
            source sourceSets.integrationTest
            runDir integrationTestDirectory
            vmArg "-Doverpowered_again.test.externalRecipe=${providers.gradleProperty('integrationExternalRecipe').orElse('false').get()}"
        }
    }
}
tasks.named('runIntegrationTest') {
    doFirst {
        mkdir integrationTestDirectory
        def compatibilityMods = providers.gradleProperty('integrationModsDirectory').orNull
        if (compatibilityMods != null) {
            copy {
                from file(compatibilityMods)
                include '*.jar'
                into "${integrationTestDirectory}/mods"
            }
        }
        copy {
            from 'test-server.properties'
            into integrationTestDirectory
            rename { 'server.properties' }
        }
        if (providers.gradleProperty('acceptMinecraftEula').orNull == 'true') {
            file("${integrationTestDirectory}/eula.txt").text = 'eula=true\n'
        }
        // Isolated configs exercise both policies without touching the user's config.
        mkdir "${integrationTestDirectory}/config"
        def legacyRecipe = providers.gradleProperty('integrationLegacyRecipe').orNull
        if (legacyRecipe != null) {
            if (!(legacyRecipe in ['true', 'false'])) throw new GradleException('integrationLegacyRecipe must be true or false')
            file("${integrationTestDirectory}/config/overpowered_again.json").text =
                    "{\"legacyRecipe\":${legacyRecipe},\"legacyTexture\":true}\n"
        }
        logger.lifecycle("Integration test directory: ${integrationTestDirectory}")
    }
    doLast {
        def result = file("${integrationTestDirectory}/test-result.txt")
        if (!result.exists() || !result.text.startsWith('PASS')) {
            throw new GradleException("Integration tests did not pass; inspect ${integrationTestDirectory}/logs/latest.log")
        }
    }
}
